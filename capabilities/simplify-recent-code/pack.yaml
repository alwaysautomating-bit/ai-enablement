id: capability.simplify-recent-code
type: capability
title: Simplify Recent Code
description: Refine a bounded code change for clarity while preserving observable behavior.
inputs: [operating_mode, target_change, repository_instructions]
skills:
  core: [simplify-recent-code]
dependencies:
  knowledge: [governed-change-refinement, recommendation-permission-execution]
  references: [anthropic-code-quality-plugins]
